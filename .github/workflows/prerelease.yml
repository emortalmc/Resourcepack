name: "Optimize resource pack"

on:
  push:
    branches:
      - "master"

jobs:
  pre-release:
    name: "Optimize resource pack"
    runs-on: "ubuntu-latest"

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # A non-shallow repository clone is required
      # - name: Run PackSquash
      #   uses: ComunidadAylas/PackSquash-action@v4.0.4
      #   with:
      #     packsquash_version: latest-unstable
      #     options: |
      #       pack_directory = 'pack'
      #       zip_spec_conformance_level = 'high'
      #       recompress_compressed_files = true
      #       validate_pack_metadata_file = false
      #       automatic_minecraft_quirks_detection = false
      #       automatic_asset_types_mask_detection = false
      #       output_file_path = '/tmp/pack.zip'
      #       skip_pack_icon = true
            
      #       ['**/*?.{fsh,vsh,glsl}']
      #       shader_source_transformation_strategy = 'keep_as_is'
      - name: Zip folder
        run: |
          # Ensure the destination directory exists
          mkdir -p /tmp
          # Compress the 'pack' folder into /tmp/pack.zip
          zip -r /tmp/pack.zip pack/
      - name: Tag and create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: /tmp/pack.zip
